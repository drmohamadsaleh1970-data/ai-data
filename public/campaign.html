<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Property enquiry</title>
  <style>
    :root { --ink: #0d1b2a; --gold: #b0843a; --soft: #f3ead8; --muted: #52627a; --line: #e4e0d6; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: var(--ink); background: #faf8f3; }
    .hero { background: linear-gradient(135deg, #0d1b2a 0%, #1b2b3d 60%, #3a3020 100%); color: #fff; padding: 40px 20px 90px; }
    .wrap { max-width: 980px; margin: 0 auto; }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .02em; opacity: .9; }
    .brand i { width: 30px; height: 30px; border-radius: 9px; background: var(--gold); display: grid; place-items: center; font-style: normal; color: #fff; }
    h1 { font-size: clamp(28px, 5vw, 44px); line-height: 1.1; margin: 22px 0 12px; max-width: 760px; }
    .lead { font-size: 17px; line-height: 1.55; color: #d6dde6; max-width: 640px; margin: 0; white-space: pre-line; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
    .chip { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); border-radius: 999px; padding: 6px 14px; font-size: 14px; }
    .card { background: #fff; border-radius: 18px; box-shadow: 0 20px 50px rgba(13,27,42,.14); padding: 26px; margin: -60px auto 30px; max-width: 600px; }
    .card h2 { margin: 0 0 4px; font-size: 22px; }
    .card p.sub { margin: 0 0 18px; color: var(--muted); }
    .trust { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; color: var(--muted); font-size: 13px; padding: 0 20px 40px; }
    .msg { text-align: center; padding: 60px 20px; }
    [dir=rtl] .lead, [dir=rtl] h1 { text-align: right; }
  </style>
</head>
<body>
  <main id="page"><div class="msg">Loading…</div></main>
  <script src="/campaign.js" defer></script>
</body>
</html>
